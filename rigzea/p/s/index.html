<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a5c44" />
  <title>შერჩეული ბინები · Rigzea</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
  <link rel="icon" href="/favicon.ico?v=5" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  <link rel="stylesheet" href="/app/app.css?v=112078b6" />
  <style>
    :root {
      --s-max: 760px;
      --s-font: 'FiraGO', 'Noto Sans Georgian', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --s-ink: #0f172a;
      --s-ink-2: #334155;
      --s-muted: #64748b;
      --s-line: #e2e8f0;
      --s-soft: #f1f5f9;
    }
    body { font-family: var(--s-font); background: #f8fafc; color: var(--s-ink); margin: 0; padding-bottom: 96px; -webkit-tap-highlight-color: transparent; }
    .s-header { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, .95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--s-line); }
    .s-nav { max-width: var(--s-max); margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .s-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; min-width: 0; }
    .s-brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
    .s-mark img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
    .s-lang { display: inline-flex; background: var(--s-soft); border: 1px solid var(--s-line); border-radius: 999px; padding: 2px; flex: none; }
    .s-lang button { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--s-muted); min-height: 30px; }
    .s-lang button[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: 0 1px 3px rgba(10, 92, 68, .25); }

    .s-main { max-width: var(--s-max); margin: 0 auto; padding: 20px 16px; }
    .s-hero { margin: 4px 0 20px; }
    .s-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, #fff); border: 1px solid color-mix(in srgb, var(--brand) 25%, #fff); padding: 4px 10px; border-radius: 999px; }
    .s-hero h1 { font-size: 26px; line-height: 1.25; margin: 12px 0 6px; font-weight: 800; letter-spacing: -.3px; }
    .s-hero p { color: var(--s-muted); font-size: 14.5px; }

    .s-list { display: flex; flex-direction: column; gap: 16px; }
    .s-card { background: #fff; border: 1px solid var(--s-line); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .03); }
    .s-photo { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, #e2e8f0, #f1f5f9); display: block; }
    .s-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .s-photo .s-nophoto { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--s-muted); font-size: 13px; }
    .s-num { position: absolute; top: 12px; left: 12px; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--s-ink); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
    .s-count { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 23, 42, .75); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
    .s-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #fff; }
    .s-thumbs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .s-body { padding: 18px 18px 16px; }
    .s-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 8px; }
    .s-price strong { font-size: 26px; font-weight: 800; color: var(--brand); letter-spacing: -.4px; line-height: 1.1; }
    .s-price span { color: var(--s-muted); font-size: 14px; font-weight: 500; }
    .s-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; line-height: 1.3; }
    .s-loc { color: var(--s-muted); font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .s-loc svg { color: var(--brand); flex: none; }
    .s-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .s-chip { font-size: 13px; font-weight: 500; color: var(--s-ink-2); background: var(--s-soft); border: 1px solid var(--s-line); border-radius: 999px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 5px; }
    .s-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .s-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; font: inherit; font-size: 14.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--s-line); background: #fff; color: var(--s-ink); transition: background .15s, transform .15s; }
    .s-btn:hover { background: var(--s-soft); }
    .s-btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .s-btn-primary:hover { background: color-mix(in srgb, var(--brand) 85%, #000); }
    .s-btn-wa { background: #25D366; border-color: #25D366; color: #fff; box-shadow: 0 4px 14px rgba(37, 211, 102, .3); }
    .s-btn-wa:hover { background: #1ebc59; }
    .s-btn-icon { width: 46px; padding: 0; }

    .s-section { background: #fff; border: 1px solid var(--s-line); border-radius: 16px; padding: 20px 18px; margin-top: 20px; }
    .s-section h2 { font-size: 17px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .s-section > p { color: var(--s-muted); font-size: 13px; margin-bottom: 14px; }
    .s-table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; -webkit-overflow-scrolling: touch; }
    .s-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .s-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--s-muted); padding: 8px 10px; border-bottom: 1px solid var(--s-line); white-space: nowrap; }
    .s-table td { padding: 12px 10px; border-bottom: 1px solid var(--s-line); vertical-align: middle; white-space: nowrap; }
    .s-table tr:last-child td { border-bottom: 0; }
    .s-table td:first-child, .s-table th:first-child { position: sticky; left: 0; background: #fff; white-space: normal; min-width: 150px; max-width: 220px; }
    .s-table td:first-child a { color: var(--s-ink); font-weight: 600; text-decoration: none; display: flex; gap: 8px; align-items: center; }
    .s-table td:first-child a:hover { color: var(--brand); }
    .s-idx { width: 22px; height: 22px; border-radius: 50%; background: var(--s-soft); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .s-best { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 1px 7px; border-radius: 999px; }
    .s-note { display: flex; gap: 8px; align-items: flex-start; color: var(--s-muted); font-size: 12.5px; margin: 20px 4px 0; line-height: 1.5; }

    .s-state { background: #fff; border: 1px solid var(--s-line); border-radius: 16px; padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 24px; }
    .s-state h1 { font-size: 20px; margin: 4px 0 0; }
    .s-state p { color: var(--s-muted); max-width: 420px; font-size: 14px; }
    .s-state-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--s-soft); color: var(--s-muted); display: flex; align-items: center; justify-content: center; }
    .s-skel { background: #fff; border: 1px solid var(--s-line); border-radius: 16px; overflow: hidden; }
    .s-skel i { display: block; background: linear-gradient(90deg, #eef2f6, #f8fafc, #eef2f6); background-size: 200% 100%; animation: s-shine 1.2s infinite linear; }
    @keyframes s-shine { to { background-position: -200% 0; } }

    .s-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; background: rgba(255, 255, 255, .96); backdrop-filter: blur(8px); border-top: 1px solid var(--s-line); box-shadow: 0 -4px 16px rgba(0, 0, 0, .08); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .s-bar-inner { max-width: var(--s-max); margin: 0 auto; display: flex; gap: 10px; }
    .s-bar .s-btn-wa { flex: 1; }
    @media (max-width: 480px) {
      .s-hero h1 { font-size: 22px; }
      .s-price strong { font-size: 23px; }
      .s-photo { aspect-ratio: 4 / 3; }
    }
    @media (prefers-reduced-motion: reduce) { .s-skel i { animation: none; } }
    @media print { .s-header, .s-bar, .s-actions { display: none !important; } body { padding-bottom: 0; } .s-card, .s-section { break-inside: avoid; box-shadow: none; } }
  </style>
</head>
<body>
  <header class="s-header">
    <div class="s-nav">
      <div class="s-brand"><span class="s-mark" id="s-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><g transform="translate(12 11.5) scale(1.2) translate(-12 -11.5)"><path d="M4 12L12 5L16.5 9"/><path d="M6.5 6.5V9.8"/><path d="M8.5 14.5L12 18L20 10"/></g></svg></span><span id="s-agency">Rigzea</span></div>
      <div class="s-lang" role="group" aria-label="Language">
        <button type="button" data-lang="ka" aria-pressed="true">ქართული</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main class="s-main" id="s-main" aria-live="polite">
    <div class="s-list" aria-label="იტვირთება">
      <div class="s-skel"><i style="aspect-ratio:16/10"></i><div style="padding:18px"><i style="height:24px;width:40%;border-radius:6px;margin-bottom:10px"></i><i style="height:16px;width:70%;border-radius:6px"></i></div></div>
      <div class="s-skel"><i style="aspect-ratio:16/10"></i></div>
    </div>
  </main>

  <aside class="s-bar" id="s-bar" hidden>
    <div class="s-bar-inner">
      <a class="s-btn s-btn-wa" id="s-wa" href="#" target="_blank" rel="noopener"></a>
      <a class="s-btn s-btn-icon" id="s-call" href="#"></a>
    </div>
  </aside>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script>
  (() => {
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = (u) => (typeof u === 'string' && /^(https?:\/\/|data:image\/)/i.test(u) ? u : '');
    const photoUrl = (p) => safeUrl(typeof p === 'string' ? p : p?.url);

    const ICON = {
      pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      wa: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 6.3a9 9 0 0 0-14.7 10L2 22l5.8-1.5a9 9 0 0 0 4.2 1.1h.1a9 9 0 0 0 9-9 9 9 0 0 0-3.5-6.3zM12 19.9a7.5 7.5 0 0 1-3.8-1l-.3-.2-3.4.9.9-3.3-.2-.4a7.5 7.5 0 1 1 13.9-3.9 7.5 7.5 0 0 1-7.1 7.9z"/></svg>',
      phone: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
      cam: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
      house: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
      link: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/><path d="M4 4l16 16"/></svg>',
      scale: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" aria-hidden="true"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0z"/></svg>',
      info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:3px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    };

    const T = {
      ka: {
        doc: 'შერჩეული ბინები', eyebrow: 'პირადი შერჩევა', title: 'თქვენთვის შერჩეული ბინები',
        count: (n) => `${n} ბინა`, client: 'კლიენტი', perMonth: '/ თვე', onRequest: 'ფასი შეთანხმებით',
        rooms: (n) => `${n} ოთახი`, beds: (n) => `${n} საძინებელი`, floor: (f) => `სართული ${f}`, pets: 'ცხოველი დასაშვებია',
        photos: (n) => `${n} ფოტო`, noPhoto: 'ფოტო ჯერ არ არის', details: 'დეტალურად', askOne: 'შეკითხვა WhatsApp-ით',
        compare: 'შედარება', compareSub: 'ფასი, ფართობი და ოთახები ერთ ცხრილში.', colApt: 'ბინა', colPrice: 'ფასი / თვე', colArea: 'ფართობი', colRooms: 'ოთახები', colSqm: '1 მ²-ის ფასი', best: 'საუკეთესო',
        bar: 'მომწერეთ WhatsApp-ში', call: 'დარეკვა',
        waAll: 'გამარჯობა! ვნახე შერჩეული ბინები და მსურს ნახვის დაჯავშნა.', waOne: (n) => `გამარჯობა! მაინტერესებს ბინა: ${n}. შესაძლებელია ნახვა?`,
        note: 'ფასები და ხელმისაწვდომობა შეიძლება შეიცვალოს. დეტალებისთვის დაუკავშირდით აგენტს.',
        nfTitle: 'შერჩევა ვერ მოიძებნა', nfText: 'ბმული არასწორია ან აღარ არის აქტიური. ახალი ბმულისთვის დაუკავშირდით აგენტს.',
        errTitle: 'გვერდი ვერ ჩაიტვირთა', errText: 'შეამოწმეთ ინტერნეტი და სცადეთ ხელახლა.', retry: 'ხელახლა ცდა',
      },
      en: {
        doc: 'Selected apartments', eyebrow: 'Personal selection', title: 'Apartments picked for you',
        count: (n) => `${n} apartment${n === 1 ? '' : 's'}`, client: 'Client', perMonth: '/ month', onRequest: 'Price on request',
        rooms: (n) => `${n} room${n === 1 ? '' : 's'}`, beds: (n) => `${n} bedroom${n === 1 ? '' : 's'}`, floor: (f) => `Floor ${f}`, pets: 'Pets allowed',
        photos: (n) => `${n} photo${n === 1 ? '' : 's'}`, noPhoto: 'No photos yet', details: 'View details', askOne: 'Ask on WhatsApp',
        compare: 'Compare', compareSub: 'Price, area and rooms side by side.', colApt: 'Apartment', colPrice: 'Price / month', colArea: 'Area', colRooms: 'Rooms', colSqm: 'Price per m²', best: 'Best',
        bar: 'Message on WhatsApp', call: 'Call',
        waAll: 'Hello! I have seen the selected apartments and would like to book a viewing.', waOne: (n) => `Hello! I am interested in this apartment: ${n}. Is a viewing possible?`,
        note: 'Prices and availability may change. Contact the agent for details.',
        nfTitle: 'Selection not found', nfText: 'This link is invalid or no longer active. Please ask your agent for a new link.',
        errTitle: 'Page could not be loaded', errText: 'Check your connection and try again.', retry: 'Try again',
      },
    };

    let lang = 'ka';
    try { lang = localStorage.getItem('rigzea_showcase_lang') === 'en' ? 'en' : 'ka'; } catch { /* storage unavailable */ }
    let state = { status: 'loading', data: null };

    const fx = () => { const r = Number(state.data?.agency?.fx_rate); return r > 0 ? r : null; };
    const fmt = (n, cur) => { const v = Math.round(Number(n)).toLocaleString('en-US'); return cur === 'GEL' ? `${v} ₾` : `$${v}`; };
    const toCur = (n, from, to) => { if (from === to) return Number(n); const r = fx(); if (!r) return null; return to === 'GEL' ? n * r : n / r; };
    const digits = (p) => String(p || '').replace(/[^0-9]/g, '');
    const waLink = (phone, text) => `https://wa.me/${digits(phone)}?text=${encodeURIComponent(text)}`;
    const detailsUrl = (a) => `/p/${encodeURIComponent(a.slug || a.id)}/`;

    function setLang(next) {
      lang = next;
      try { localStorage.setItem('rigzea_showcase_lang', next); } catch { /* storage unavailable */ }
      document.documentElement.lang = next;
      document.querySelectorAll('.s-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === next)));
      render();
    }
    document.querySelectorAll('.s-lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

    function stateHtml(icon, title, text, retry) {
      return `<div class="s-state"><div class="s-state-icon">${icon}</div><h1>${esc(title)}</h1><p>${esc(text)}</p>${retry ? `<button type="button" class="s-btn s-btn-primary" id="s-retry">${esc(T[lang].retry)}</button>` : ''}</div>`;
    }

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      const main = $('#s-main');
      if (state.status === 'loading') return;
      if (state.status !== 'ok') {
        document.title = `${state.status === 'error' ? t.errTitle : t.nfTitle} · Rigzea`;
        main.innerHTML = state.status === 'error' ? stateHtml(ICON.link, t.errTitle, t.errText, true) : stateHtml(ICON.link, t.nfTitle, t.nfText, false);
        $('#s-retry')?.addEventListener('click', load);
        $('#s-bar').hidden = true;
        return;
      }

      const { selection, apartments, agency } = state.data;
      const phone = agency?.phone || apartments.find(a => a.agent_phone)?.agent_phone || '';
      document.title = `${t.doc} · ${agency?.name || 'Rigzea'}`;

      // Comparison helpers
      const priceIn = (a, cur) => (a.price ? toCur(Number(a.price), a.currency || 'USD', cur) : null);
      const baseCur = apartments[0]?.currency || 'USD';
      const prices = apartments.map(a => priceIn(a, baseCur));
      const sqm = apartments.map((a, i) => (prices[i] !== null && Number(a.area_sqm) > 0 ? prices[i] / Number(a.area_sqm) : null));
      const minOf = (arr) => { const v = arr.filter(x => x !== null); return v.length > 1 ? Math.min(...v) : null; };
      const maxOf = (arr) => { const v = arr.filter(x => x !== null); return v.length > 1 ? Math.max(...v) : null; };
      const bestPrice = minOf(prices), bestSqm = minOf(sqm), bestArea = maxOf(apartments.map(a => (Number(a.area_sqm) > 0 ? Number(a.area_sqm) : null)));
      const bestTag = `<span class="s-best">${esc(t.best)}</span>`;

      const card = (a, i) => {
        const photos = (a.photos || []).map(photoUrl).filter(Boolean);
        const cur = a.currency === 'GEL' ? 'GEL' : 'USD';
        const other = cur === 'USD' ? 'GEL' : 'USD';
        const alt = a.price ? toCur(Number(a.price), cur, other) : null;
        const loc = [a.district, a.city].filter(Boolean).join(', ');
        const chips = [a.rooms && t.rooms(a.rooms), a.bedrooms && t.beds(a.bedrooms), Number(a.area_sqm) > 0 && `${a.area_sqm} მ²`, a.floor && t.floor(a.total_floors ? `${a.floor}/${a.total_floors}` : a.floor), a.pets_allowed && t.pets].filter(Boolean);
        return `<article class="s-card">
          <a class="s-photo" href="${detailsUrl(a)}" aria-label="${esc(a.title)}">
            ${photos[0] ? `<img src="${esc(photos[0])}" alt="${esc(a.title)}" loading="${i ? 'lazy' : 'eager'}" />` : `<span class="s-nophoto">${ICON.house}${esc(t.noPhoto)}</span>`}
            <span class="s-num">${i + 1}</span>
            ${photos.length > 1 ? `<span class="s-count">${ICON.cam} ${esc(t.photos(photos.length))}${photos.length >= 4 ? "+" : ""}</span>` : ''}
          </a>
          ${photos.length >= 4 ? `<div class="s-thumbs">${photos.slice(1, 4).map(p => `<img src="${esc(p)}" alt="" loading="lazy" />`).join('')}</div>` : ''}
          <div class="s-body">
            <div class="s-price">${a.price ? `<strong>${fmt(a.price, cur)}</strong><span>${alt !== null ? `(~${fmt(alt, other)}) ` : ''}${a.transaction_type === 'sale' ? '' : esc(t.perMonth)}</span>` : `<strong style="font-size:20px">${esc(t.onRequest)}</strong>`}</div>
            <h2 class="s-title">${esc(a.title)}</h2>
            ${loc ? `<div class="s-loc">${ICON.pin}<span>${esc(loc)}</span></div>` : ''}
            ${chips.length ? `<div class="s-chips">${chips.map(c => `<span class="s-chip">${esc(c)}</span>`).join('')}</div>` : ''}
            <div class="s-actions">
              <a class="s-btn s-btn-primary" href="${detailsUrl(a)}">${esc(t.details)}</a>
              ${phone ? `<a class="s-btn s-btn-icon s-btn-wa" href="${waLink(phone, t.waOne(a.title))}" target="_blank" rel="noopener" aria-label="${esc(t.askOne)}" title="${esc(t.askOne)}">${ICON.wa}</a>` : ''}
            </div>
          </div>
        </article>`;
      };

      main.innerHTML = `
        <section class="s-hero">
          <span class="s-eyebrow">${esc(t.eyebrow)}</span>
          <h1>${esc(t.title)}</h1>
          <p>${[selection?.client_name ? `${esc(t.client)}: ${esc(selection.client_name)}` : '', esc(t.count(apartments.length))].filter(Boolean).join(' · ')}</p>
        </section>
        <div class="s-list">${apartments.map(card).join('')}</div>
        ${apartments.length > 1 ? `
        <section class="s-section" aria-labelledby="s-cmp">
          <h2 id="s-cmp">${ICON.scale} ${esc(t.compare)}</h2>
          <p>${esc(t.compareSub)}</p>
          <div class="s-table-wrap"><table class="s-table">
            <thead><tr><th scope="col">${esc(t.colApt)}</th><th scope="col">${esc(t.colPrice)}</th><th scope="col">${esc(t.colArea)}</th><th scope="col">${esc(t.colRooms)}</th><th scope="col">${esc(t.colSqm)}</th></tr></thead>
            <tbody>${apartments.map((a, i) => `<tr>
              <td><a href="${detailsUrl(a)}"><span class="s-idx">${i + 1}</span><span>${esc(a.title)}</span></a></td>
              <td>${a.price ? fmt(a.price, a.currency === 'GEL' ? 'GEL' : 'USD') : '–'}${bestPrice !== null && prices[i] === bestPrice ? bestTag : ''}</td>
              <td>${Number(a.area_sqm) > 0 ? `${a.area_sqm} მ²` : '–'}${bestArea !== null && Number(a.area_sqm) === bestArea ? bestTag : ''}</td>
              <td>${a.rooms || '–'}${a.bedrooms ? ` <span style="color:var(--s-muted)">(${esc(t.beds(a.bedrooms))})</span>` : ''}</td>
              <td>${sqm[i] !== null ? fmt(sqm[i], baseCur) : '–'}${bestSqm !== null && sqm[i] === bestSqm ? bestTag : ''}</td>
            </tr>`).join('')}</tbody>
          </table></div>
        </section>` : ''}
        <p class="s-note">${ICON.info}<span>${esc(t.note)}${agency?.name ? ` · ${esc(agency.name)}` : ''}</span></p>`;

      const bar = $('#s-bar');
      bar.hidden = !phone;
      if (phone) {
        $('#s-wa').href = waLink(phone, t.waAll);
        $('#s-wa').innerHTML = `${ICON.wa}<span>${esc(t.bar)}</span>`;
        $('#s-call').href = `tel:${esc(phone.replace(/[^0-9+]/g, ''))}`;
        $('#s-call').innerHTML = ICON.phone;
        $('#s-call').setAttribute('aria-label', t.call);
      }
    }

    function applyBranding(agency) {
      if (!agency) return;
      $('#s-agency').textContent = agency.name || 'Rigzea';
      if (/^#[0-9a-fA-F]{6}$/.test(agency.brand_color || '')) {
        document.documentElement.style.setProperty('--brand', agency.brand_color);
        document.querySelector('meta[name=theme-color]').setAttribute('content', agency.brand_color);
      }
      const logo = safeUrl(agency.logo_url);
      if (logo) $('#s-mark').innerHTML = `<img src="${esc(logo)}" alt="" />`;
    }

    async function load() {
      const slug = (new URLSearchParams(location.search).get('id') || '').trim().toLowerCase();
      // Fail closed: no slug, bad slug or no data never shows demo listings.
      if (!/^[a-z0-9]{8,40}$/.test(slug) || !window.supabaseClient) { state = { status: 'not_found' }; render(); return; }
      try {
        const { data, error } = await window.supabaseClient.rpc('get_public_selection', { p_slug: slug });
        if (error) throw error;
        if (!data?.success || !Array.isArray(data.apartments) || !data.apartments.length) { state = { status: 'not_found' }; render(); return; }
        state = { status: 'ok', data };
        applyBranding(data.agency);
      } catch (err) {
        console.warn('Selection load failed:', err?.message || err);
        state = { status: /fetch|network/i.test(String(err?.message || '')) ? 'error' : 'not_found' };
      }
      render();
    }

    setLang(lang);
    load();
  })();
  </script>
</body>
</html>
