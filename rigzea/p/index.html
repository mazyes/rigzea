<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a5c44" />
  <title>ბინა</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%230a5c44'/%3E%3Cpath d='M10 12h20M10 20h15M10 28h20' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app/app.css" />
  <style>
    :root { --showcase-max: 760px; }
    html { background: #f6f7f9; }
    body {
      font-family: 'FiraGO', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7f9; color: #0f172a; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body.has-bar { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    [hidden] { display: none !important; }

    .p-header { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .95); backdrop-filter: blur(8px); }
    .p-nav-inner { max-width: var(--showcase-max); margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; box-sizing: border-box; }
    .p-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-weight: 700; font-size: 16px; min-width: 0; }
    .p-brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-brand-mark { width: 30px; height: 30px; background: var(--brand); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; font-size: 14px; }
    .p-brand-logo { height: 30px; max-width: 120px; object-fit: contain; flex: none; }
    .p-lang-switch { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
    .p-lang-btn { border: none; background: none; font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
    .p-lang-btn[aria-pressed="true"] { background: var(--brand); color: #fff; }

    .p-container { max-width: var(--showcase-max); margin: 0 auto; padding: 16px; }
    .p-demo { margin-bottom: 12px; font-size: 13px; padding: 10px 14px; border-radius: 12px; background: var(--info-bg); color: var(--info); }

    /* Gallery */
    .p-gallery { position: relative; border-radius: 16px; overflow: hidden; background: #0f172a; aspect-ratio: 16 / 10; touch-action: pan-y; user-select: none; }
    .p-slides { display: flex; width: 100%; height: 100%; transition: transform .35s cubic-bezier(.25, 1, .5, 1); }
    .p-slide { min-width: 100%; height: 100%; cursor: zoom-in; }
    .p-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-gallery-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .92); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #0f172a; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); z-index: 2; }
    .p-gallery-btn.prev { left: 12px; } .p-gallery-btn.next { right: 12px; }
    .p-gallery-counter { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 23, 42, .75); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .p-gallery-badge { position: absolute; top: 12px; left: 12px; z-index: 2; background: var(--brand); color: #fff; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
    .p-thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .p-thumbs::-webkit-scrollbar { display: none; }
    .p-thumb { flex: none; width: 72px; height: 54px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--surface-2); opacity: .7; }
    .p-thumb[aria-current="true"] { border-color: var(--brand); opacity: 1; }
    .p-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-nophoto { aspect-ratio: 16 / 7; border-radius: 16px; background: var(--surface-2); border: 1px dashed var(--line-strong); display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: var(--muted); font-size: 13.5px; }
    @media (max-width: 600px) {
      .p-gallery { border-radius: 12px; aspect-ratio: 4 / 3; }
      .p-gallery-btn { display: none; }
    }

    .p-lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .95); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .p-lightbox.open { display: flex; }
    .p-lightbox img { max-width: 95vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
    .p-lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, .2); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .p-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 14px; }
    @media (max-width: 600px) { .p-card { padding: 18px 16px; } }
    .p-price-main { font-size: 30px; font-weight: 700; color: var(--brand); letter-spacing: -.3px; line-height: 1.1; }
    .p-price-sub { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 4px; }
    .p-title { font-size: 21px; font-weight: 700; margin: 10px 0 6px; line-height: 1.3; }
    .p-location { font-size: 14px; color: var(--muted); display: flex; align-items: flex-start; gap: 6px; margin-bottom: 18px; }
    .p-location svg { color: var(--brand); flex: none; margin-top: 2px; }
    .p-specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .p-spec { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px; text-align: center; }
    .p-spec-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
    .p-spec-val { font-size: 16px; font-weight: 700; }
    .p-terms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    @media (max-width: 600px) { .p-terms { grid-template-columns: 1fr; } }
    .p-term { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
    .p-term-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
    .p-term h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .p-term p { margin: 0; font-size: 14px; line-height: 1.4; font-weight: 500; }

    .p-h2 { font-size: 17px; font-weight: 700; margin: 0 0 14px; }
    .p-amenities { display: flex; flex-wrap: wrap; gap: 8px; }
    .p-amenity { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; padding: 7px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; color: #334155; font-weight: 500; }
    .p-amenity svg { color: var(--brand); flex: none; }
    .p-desc { font-size: 14.5px; line-height: 1.65; color: #334155; white-space: pre-line; overflow-wrap: anywhere; }
    .p-map { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; background: var(--surface-2); display: block; }
    .p-map-link { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--brand); font-weight: 600; text-decoration: none; }

    .p-agent { display: flex; align-items: center; gap: 12px; }
    .p-agent-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; overflow: hidden; }
    .p-agent-avatar img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .p-agent strong { display: block; font-size: 15px; }
    .p-agent span { font-size: 13px; color: var(--muted); }
    .p-footer { text-align: center; font-size: 12px; color: var(--muted); padding: 22px 0 8px; }
    .p-footer a { color: inherit; }

    .p-state { text-align: center; padding: 64px 20px; max-width: 440px; margin: 0 auto; }
    .p-state-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 16px; color: var(--muted); }
    .p-state h1 { font-size: 20px; margin: 0 0 8px; }
    .p-state p { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 0 0 18px; }
    .p-skel { background: linear-gradient(90deg, #eceff2 25%, #f5f6f8 50%, #eceff2 75%); background-size: 200% 100%; animation: p-shimmer 1.2s infinite; border-radius: 12px; }
    @keyframes p-shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .p-skel { animation: none; } .p-slides { transition: none; } }

    .p-bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0, 0, 0, .06); z-index: 100; background: rgba(255, 255, 255, .97); }
    .p-bottom-inner { max-width: var(--showcase-max); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .p-bottom-price { display: none; flex-direction: column; }
    @media (min-width: 520px) { .p-bottom-price { display: flex; } }
    .p-bottom-price small { font-size: 11px; color: var(--muted); }
    .p-bottom-price b { font-size: 18px; color: var(--brand); line-height: 1.1; }
    .p-btn-wa { flex: 1; background: #1fa855; color: #fff; border-radius: 12px; padding: 13px 18px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; min-height: 48px; box-sizing: border-box; }
    .p-btn-wa:hover { background: #1a9449; }
    .p-btn-call { background: var(--surface-2); border: 1px solid var(--line); color: #0f172a; border-radius: 12px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex: none; }

    @media print {
      body { background: #fff !important; padding-bottom: 0 !important; }
      .p-header, .p-bottom-bar, .p-gallery-btn, .p-lightbox, .p-thumbs, .p-map, .p-lang-switch { display: none !important; }
      .p-card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="p-header">
    <div class="p-nav-inner">
      <a class="p-brand" id="brand" href="/" aria-label="რიგზეა">
        <span class="p-brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M5 6.5h14M5 12h10M5 17.5h14"/></svg></span>
        <span>რიგზეა</span>
      </a>
      <div class="p-lang-switch" role="group" aria-label="ენა / Language">
        <button type="button" class="p-lang-btn" data-lang="ka" aria-pressed="true">ქართ</button>
        <button type="button" class="p-lang-btn" data-lang="en" aria-pressed="false">ENG</button>
      </div>
    </div>
  </header>

  <main class="p-container" id="p-main" aria-live="polite">
    <div aria-hidden="true">
      <div class="p-skel" style="aspect-ratio:16/10"></div>
      <div class="p-skel" style="height:150px;margin-top:14px"></div>
    </div>
  </main>

  <aside class="p-bottom-bar" id="bottom-bar" hidden>
    <div class="p-bottom-inner">
      <div class="p-bottom-price"><small id="bar-label"></small><b id="bar-price"></b></div>
      <a class="p-btn-wa" id="btn-whatsapp" href="#" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 6.3a9 9 0 0 0-14.7 10L2 22l5.8-1.5a9 9 0 0 0 4.2 1.1h.1a9 9 0 0 0 9-9 9 9 0 0 0-3.5-6.3zM12 19.9a7.5 7.5 0 0 1-3.8-1l-.3-.2-3.4.9.9-3.3-.2-.4a7.5 7.5 0 1 1 13.9-3.9 7.5 7.5 0 0 1-7.1 7.9z"/></svg>
        <span id="btn-whatsapp-text"></span>
      </a>
      <a class="p-btn-call" id="btn-call" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
    </div>
  </aside>

  <div class="p-lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button type="button" class="p-lightbox-close" id="lightbox-close"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <img id="lightbox-img" src="data:," alt="" />
  </div>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script>
  (() => {
    'use strict';
    const sb = window.supabaseClient;
    const $ = (s) => document.querySelector(s);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };

    const WL = params.get('wl') === '1';
    const SELECTION = UUID_RE.test(params.get('s') || '') ? params.get('s') : null;

    let lang = store.get('rigzea_showcase_lang') === 'en' ? 'en' : 'ka';
    let listing = null;   // { apartment, agency }

        demo: 'სადემონსტრაციო განცხადება — ასე გამოიყურება ბმული, რომელსაც აგენტი კლიენტს უგზავნის.',

    const svg = (d, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const ICON = {

    // ------------------------------------------------------------------ data
    async function rpc(name, args) {
      const { data, error } = await sb.rpc(name, args);
      if (error) throw error;
      return data;
    }

    async function load() {
      state = 'loading'; render();
      if (!REF) { listing = DEMO; demo = true; state = 'ready'; render(); return; }
      const boot = window.__RIGZEA_LISTING__;
      try {
        let data = boot && boot.ref === REF ? boot.data : null;
        window.__RIGZEA_LISTING__ = null;
        if (!data) {
          try { data = await rpc('get_public_listing', { p_ref: REF }); }
          catch (err) {
            // Database patch 01 not applied yet: older RPC only resolves ids.
            if (UUID_RE.test(REF) && /does not exist|PGRST202|Could not find/i.test(err.message || '')) data = await rpc('get_public_showcase', { p_apartment_id: REF });
            else throw err;
          }
        }
        if (data && data.success && data.apartment) { listing = data; state = 'ready'; }
        else { listing = null; state = 'notfound'; }
      } catch (err) {
        console.warn('listing load failed', err);
        state = 'error';
      }
      render();
      if (state === 'ready') track('view');
    }

    function visitorId() {
      let v = store.get('rigzea_vid');
      if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, ''); store.set('rigzea_vid', v); }
      return v;
    }

    let isTeam = null;
    async function track(kind) {
      if (demo || !listing) return;
      try {
        if (isTeam === null) { const { data } = await sb.auth.getSession(); isTeam = Boolean(data && data.session); }
        if (isTeam) return; // agents previewing their own link are not counted
        await sb.rpc('track_link_event', { p_ref: listing.apartment.slug || listing.apartment.id, p_kind: kind, p_visitor: visitorId(), p_selection_id: SELECTION });
      } catch { /* analytics must never break the page */ }
    }

    // ------------------------------------------------------------------ helpers
    const t = () => I18N[lang];
    function money(n, cur) {
      const v = Number(n);
      if (!v) return '';
      const s = Math.round(v).toLocaleString('en-US').replace(/,/g, ' ');
      return cur === 'GEL' ? `${s} ₾` : `$${s}`;
    }
    function photosOf(a) {
      return (Array.isArray(a.photos) ? a.photos : [])
        .map((p, i) => typeof p === 'string' ? { url: p, thumb: p, order: i } : { url: p && p.url, thumb: (p && (p.thumb || p.url)), order: p && p.order != null ? Number(p.order) : i })
        .filter(p => p.url && /^(https?:|data:image\/)/.test(p.url))
        .sort((x, y) => x.order - y.order);
    }
    const shareUrl = () => {
      const a = listing.apartment;
      if (demo) return location.href;
      return `${location.origin}/p/${encodeURIComponent(a.slug || a.id)}/${WL ? '?wl=1' : ''}`;
    };
    const phoneOf = () => String(listing.apartment.agent_phone || listing.agency?.phone || '').trim();
    const validColor = (c) => /^#[0-9a-f]{6}$/i.test(c || '') ? c : null;

    function applyBranding() {
      const ag = (listing && listing.agency) || {};
      const color = validColor(ag.brand_color);
      if (color) {
        document.documentElement.style.setProperty('--brand', color);
        document.documentElement.style.setProperty('--brand-soft', color + '1a');
        document.querySelector('meta[name=theme-color]').setAttribute('content', color);
      }
      const brand = $('#brand');
      const name = ag.name && !demo ? ag.name : '';
      if (name || ag.logo_url) {
        brand.removeAttribute('href');
        brand.setAttribute('aria-label', name || t().agency);
        brand.innerHTML = (ag.logo_url ? `<img class="p-brand-logo" src="${esc(ag.logo_url)}" alt="" />` : `<span class="p-brand-mark">${esc((name || '·').trim().charAt(0).toUpperCase())}</span>`) + (name ? `<span>${esc(name)}</span>` : '');
      } else if (WL) {
        brand.removeAttribute('href');
        brand.innerHTML = '';
      } else {
        brand.href = '/';

    // ------------------------------------------------------------------ render
    function render() {
      const L = t();
      document.documentElement.lang = lang;
      document.querySelectorAll('.p-lang-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      const main = $('#p-main');
      const bar = $('#bottom-bar');
      bar.hidden = true;
      document.body.classList.remove('has-bar');

      if (state === 'loading') return;
      if (state === 'notfound' || state === 'error') {
        applyBranding();
        const nf = state === 'notfound';
        document.title = nf ? L.notFoundTitle : L.errorTitle;
        main.innerHTML = `<section class="p-state">
          <div class="p-state-icon">${svg(nf ? ICON.search : ICON.alert, 26)}</div>
          <h1>${esc(nf ? L.notFoundTitle : L.errorTitle)}</h1>

        return;
      }

      const a = listing.apartment;
      const ag = listing.agency || {};

      document.title = ag.name && !demo ? `${title} · ${ag.name}` : WL ? title : `${title} · ${L.brand}`;

      const photos = photosOf(a);

      const loc = [a.address, a.district, a.city].filter(Boolean).join(', ');
      const rt = a.rental_type || 'long_term';

      const specs = [
        a.rooms && [L.rooms, a.rooms],

        a.prepayment_terms && [ICON.key, L.prepayment, a.prepayment_terms],
        Number(a.deposit_amount) > 0 && [ICON.shield, L.deposit, money(a.deposit_amount, a.currency)],
        rt !== 'long_term' && a.checkin_time && [ICON.clock, L.checkTimes, `${hhmm(a.checkin_time)} / ${hhmm(a.checkout_time) || '—'}`],
      ].filter(Boolean);

      const amenities = (Array.isArray(a.amenities) ? a.amenities : []).filter(x => typeof x === 'string' && x.trim());
      const desc = String((lang === 'en' && a.description_en) || a.description || '').trim();
      const lat = Number(a.lat), lng = Number(a.lng);
      const hasCoords = a.lat != null && a.lng != null && isFinite(lat) && isFinite(lng) && (lat || lng);
      const coords = hasCoords ? { lat, lng } : geo;
      const mapQuery = [a.address, a.city, 'Georgia'].filter(Boolean).join(', ');
      const phone = phoneOf();
      const agentName = ag.agent_name || '';

      main.innerHTML = `
        ${demo ? `<div class="p-demo">${esc(L.demo)}</div>` : ''}
        ${photos.length ? `
          <div class="p-gallery" id="gallery">
            ${badge ? `<span class="p-gallery-badge">${esc(badge)}</span>` : ''}
            <div class="p-slides" id="slides">${photos.map((p, i) => `<div class="p-slide" data-i="${i}"><img src="${esc(p.url)}" alt="${esc(title)} — ${esc(L.photo)} ${i + 1}" onerror="this.style.visibility='hidden'" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} /></div>`).join('')}</div>
            ${photos.length > 1 ? `<button type="button" class="p-gallery-btn prev" data-step="-1" aria-label="${esc(L.prev)}">${svg('<path d="m15 18-6-6 6-6"/>', 20)}</button>
            <button type="button" class="p-gallery-btn next" data-step="1" aria-label="${esc(L.next)}">${svg('<path d="m9 18 6-6-6-6"/>', 20)}</button>
            <div class="p-gallery-counter" id="counter"></div>` : ''}
          </div>
          ${photos.length > 1 ? `<div class="p-thumbs" id="thumbs">${photos.map((p, i) => `<button type="button" class="p-thumb" data-i="${i}" aria-label="${esc(L.photo)} ${i + 1}"><img src="${esc(p.thumb || p.url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></button>`).join('')}</div>` : ''}`
        : `<div class="p-nophoto">${svg(ICON.camera, 26)}<span>${esc(L.noPhotos)}</span>${badge ? `<span class="badge badge-ok">${esc(badge)}</span>` : ''}</div>`}

        <section class="p-card">
          <div><span class="p-price-main">${esc(price || L.priceOnRequest)}</span>${price ? `<span class="p-price-sub">${esc(L.perMonth)}</span>` : ''}</div>
          <h1 class="p-title">${esc(title)}</h1>
          ${loc ? `<div class="p-location">${svg(ICON.pin)}<span>${esc(loc)}</span></div>` : ''}
          ${specs.length ? `<div class="p-specs">${specs.map(([l, v]) => `<div class="p-spec"><span class="p-spec-label">${esc(l)}</span><span class="p-spec-val">${esc(v)}</span></div>`).join('')}</div>` : ''}
          <div class="p-terms">${terms.map(([ic, h, v]) => `<div class="p-term"><div class="p-term-icon">${svg(ic, 18)}</div><div><h4>${esc(h)}</h4><p>${esc(v)}</p></div></div>`).join('')}</div>
        </section>

        ${amenities.length ? `<section class="p-card"><h2 class="p-h2">${esc(L.amenities)}</h2><div class="p-amenities">${amenities.map(id => {
          const d = AMENITIES[id];
          return `<span class="p-amenity">${svg(d ? d[2] : ICON.check)}<span>${esc(d ? (lang === 'ka' ? d[0] : d[1]) : id)}</span></span>`;
        }).join('')}</div></section>` : ''}

        ${desc ? `<section class="p-card"><h2 class="p-h2">${esc(L.description)}</h2><div class="p-desc">${esc(desc)}</div></section>` : ''}

        ${coords || a.address ? `<section class="p-card"><h2 class="p-h2">${esc(L.location)}</h2>

            src="https://www.openstreetmap.org/export/embed.html?bbox=${coords.lng - 0.007},${coords.lat - 0.0045},${coords.lng + 0.007},${coords.lat + 0.0045}&layer=mapnik&marker=${coords.lat},${coords.lng}"></iframe>` : ''}
          <a class="p-map-link" target="_blank" rel="noopener" href="${coords ? `https://www.openstreetmap.org/?mlat=${coords.lat}&mlon=${coords.lng}#map=17/${coords.lat}/${coords.lng}` : `https://www.openstreetmap.org/search?query=${encodeURIComponent(mapQuery)}`}">${svg(ICON.ext, 14)} ${esc(L.openMap)}</a>

          <div><strong>${esc(agentName || ag.name)}</strong><span>${esc(agentName && ag.name ? `${L.agent} · ${ag.name}` : agentName ? L.agent : L.agency)}</span></div>
        </div></section>` : ''}

        ${WL ? '' : `<p class="p-footer"><a href="/">${esc(L.powered)}</a></p>`}`;

      // Contact bar
      const digits = phone.replace(/[^0-9]/g, '');
      if (digits.length >= 9 || demo) {
        const waText = L.waMessage.replace('{name}', title).replace('{url}', shareUrl());
        $('#btn-whatsapp').href = digits ? `https://wa.me/${digits}?text=${encodeURIComponent(waText)}` : `https://wa.me/?text=${encodeURIComponent(waText)}`;
        $('#btn-whatsapp-text').textContent = L.whatsapp;
        const call = $('#btn-call');
        call.hidden = !digits;
        call.href = `tel:+${digits.startsWith('995') || digits.length > 9 ? digits : '995' + digits}`;
        call.setAttribute('aria-label', L.call);
        call.title = L.call;
        $('#bar-label').textContent = L.barLabel;
        $('#bar-price').textContent = price || L.priceOnRequest;
        bar.hidden = false;
        document.body.classList.add('has-bar');
      }

      bindGallery(photos.length);
      if (!coords && a.address && !geo) geocode(mapQuery);
    }

    // ------------------------------------------------------------------ map
    async function geocode(q) {
      const key = 'rigzea_geo:' + q;
      try {
        const cached = sessionStorage.getItem(key);
        if (cached) { geo = JSON.parse(cached); if (geo) render(); return; }
      } catch { /* ignore */ }
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ge&accept-language=ka&q=${encodeURIComponent(q)}`);
        const list = await res.json();
        const hit = Array.isArray(list) && list[0];
        const g = hit ? { lat: Number(hit.lat), lng: Number(hit.lon) } : null;
        try { sessionStorage.setItem(key, JSON.stringify(g)); } catch { /* ignore */ }
        if (g && isFinite(g.lat) && isFinite(g.lng)) { geo = g; render(); }
      } catch { /* map link stays available */ }
    }

    // ------------------------------------------------------------------ gallery
    function bindGallery(total) {
      if (!total) return;
      const slides = $('#slides');
      const go = (i) => {
        slide = (i + total) % total;
        slides.style.transform = `translateX(-${slide * 100}%)`;
        const c = $('#counter'); if (c) c.textContent = `${slide + 1} / ${total}`;
        document.querySelectorAll('.p-thumb').forEach((b, j) => b.setAttribute('aria-current', String(j === slide)));
        document.querySelector(`.p-thumb[data-i="${slide}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      };
      go(slide);
      document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => go(slide + Number(b.dataset.step))));
      document.querySelectorAll('.p-thumb').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.i))));
      const g = $('#gallery');
      let x0 = null;
      g.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].screenX; }, { passive: true });
      g.addEventListener('touchend', (e) => { if (x0 == null) return; const d = x0 - e.changedTouches[0].screenX; if (Math.abs(d) > 40) go(slide + (d > 0 ? 1 : -1)); x0 = null; }, { passive: true });
      slides.addEventListener('click', (e) => {
        const img = e.target.closest('.p-slide')?.querySelector('img');
        if (!img) return;
        $('#lightbox-img').src = img.src;
        $('#lightbox-img').alt = img.alt;
        $('#lightbox').classList.add('open');
        $('#lightbox-close').focus();
      });
      g.tabIndex = 0;
      g.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go(slide - 1); if (e.key === 'ArrowRight') go(slide + 1); });
    }

    const closeLightbox = () => $('#lightbox').classList.remove('open');
    $('#lightbox-close').addEventListener('click', closeLightbox);
    $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    $('#lightbox-close').setAttribute('aria-label', t().close);

    // ------------------------------------------------------------------ events
    document.querySelectorAll('.p-lang-btn').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('rigzea_showcase_lang', lang); render(); }));
    $('#btn-whatsapp').addEventListener('click', () => track('whatsapp'));
    $('#btn-call').addEventListener('click', () => track('call'));

    load();
  })();
  </script>
</body>
