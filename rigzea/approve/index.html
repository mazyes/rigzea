<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a5c44" />
  <meta name="robots" content="noindex" />
  <title>ხარჯის თანხმობა · რიგზეა</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
  <link rel="icon" href="/favicon.ico?v=5" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  <link rel="stylesheet" href="/app/app.css?v=112078b6" />
  <style>
    .ap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    .ap-org { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .ap-amount { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
    .ap-question { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .ap-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .ap-actions .btn { min-height: 52px; font-size: 16px; }
    .ap-confirm { padding: 14px; border-radius: var(--r); border: 2px solid var(--line-strong); }
    .ap-result { padding: 16px; border-radius: var(--r); font-size: 15px; }
    .ap-result.ok { background: var(--ok-bg); color: var(--ok); }
    .ap-result.no { background: var(--danger-bg); color: var(--danger); }
  </style>
</head>
<body>
  <main class="ap" id="ap" aria-live="polite">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="ap-org" style="margin-bottom:0"><a class="brand" href="/" style="font-size:15px;text-decoration:none"><span class="brand-mark" style="width:22px;height:22px;border-radius:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><g transform="translate(12 11.5) scale(1.2) translate(-12 -11.5)"><path d="M4 12L12 5L16.5 9"/><path d="M6.5 6.5V9.8"/><path d="M8.5 14.5L12 18L20 10"/></g></svg></span><span class="brand-text">რიგზეა<i>.</i></span></a> <span style="color:var(--muted)" id="ap-sub">· ხარჯის თანხმობა</span></div>
      <div class="lang-switcher" style="display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)">
        <button type="button" class="lang-btn active" id="btn-ap-ka" style="border:0;background:var(--brand);color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;cursor:pointer">KA</button>
        <button type="button" class="lang-btn" id="btn-ap-en" style="border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;cursor:pointer">EN</button>
      </div>
    </div>
    <div class="card"><div class="skeleton" aria-label="იტვირთება"><i></i><i></i><i></i></div></div>
  </main>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script>
  (() => {
    const { sb, esc, money } = R;
    const root = document.getElementById('ap');
    const head = root.firstElementChild.outerHTML;
    const token = new URLSearchParams(location.search).get('token');
    let data = null;
    let lang = localStorage.getItem('rigzea_ap_lang') || 'ka';

    const I18N = {
      ka: {
        sub: '· ხარჯის თანხმობა',
        reqBy: (o, org) => `${o ? o + ', ' : ''}${org || 'მმართველი კომპანია'} გთხოვთ თანხმობას ხარჯზე:`,
        expense: 'ხარჯი',
        reqAt: 'მოთხოვნილია',
        details: 'განმარტება',
        comment: 'თქვენი კომენტარი',
        approve: 'დადასტურება',
        decline: 'უარყოფა',
        yesApprove: 'დიახ, ვადასტურებ',
        yesDecline: 'დიახ, უარს ვამბობ',
        back: 'უკან',
        commentField: 'კომენტარი მმართველისთვის (არასავალდებულო)',
        confirmApprove: (amt) => `ადასტურებთ ${amt}-ის ხარჯს?`,
        confirmDecline: 'უარს ამბობთ ამ ხარჯზე?',
        noteApprove: 'მმართველი მიიღებს თანხმობას და დაიწყებს სამუშაოს.',
        noteDecline: 'სამუშაო არ შესრულდება, სანამ მმართველთან არ შეთანხმდებით.',
        approvedMsg: 'ხარჯი დადასტურებულია.',
        declinedMsg: 'ხარჯზე უარი დაფიქსირდა.',
        approvedFollow: 'მმართველი შეასრულებს სამუშაოს და ქვითარს ამონაწერში ნახავთ.',
        declinedFollow: 'მმართველი დაგიკავშირდებათ ალტერნატივით.',
        cancelledMsg: 'მმართველმა ეს მოთხოვნა გააუქმა. პასუხი აღარ არის საჭირო.',
        expiredMsg: 'მოთხოვნის ვადა ამოიწურა. სთხოვეთ მმართველს ახალი ბმული.',
        callPrompt: 'კითხვა გაქვთ? დაურეკეთ მმართველს:',
        invalidLink: 'ბმული არასრულია. სთხოვეთ მმართველს ბმულის ხელახლა გამოგზავნა.',
        notFound: 'მოთხოვნა ვერ მოიძებნა. შესაძლოა გაუქმდა. დაუკავშირდით მმართველს.',
        retry: 'ხელახლა ცდა',
      },
      en: {
        sub: '· Expense Approval',
        reqBy: (o, org) => `${o ? o + ', ' : ''}${org || 'Property Manager'} requests your approval for:`,
        expense: 'Expense',
        reqAt: 'Requested on',
        details: 'Description',
        comment: 'Your comment',
        approve: 'Approve',
        decline: 'Decline',
        yesApprove: 'Yes, Approve',
        yesDecline: 'Yes, Decline',
        back: 'Back',
        commentField: 'Comment for property manager (optional)',
        confirmApprove: (amt) => `Approve expense of ${amt}?`,
        confirmDecline: 'Decline this expense?',
        noteApprove: 'The manager will receive approval and proceed with the maintenance.',
        noteDecline: 'Work will be put on hold until you coordinate with the manager.',
        approvedMsg: 'Expense approved.',
        declinedMsg: 'Expense declined.',
        approvedFollow: 'The manager will proceed with the repair and attach receipts to your monthly statement.',
        declinedFollow: 'The manager will follow up with alternative solutions.',
        cancelledMsg: 'This request was cancelled by the manager.',
        expiredMsg: 'This request has expired. Please ask the manager for an updated link.',
        callPrompt: 'Questions? Call host/manager:',
        invalidLink: 'Incomplete link. Please request a new link from your property manager.',
        notFound: 'Approval request not found or cancelled. Please contact your manager.',
        retry: 'Retry',
      }
    };

    const show = (html) => {
      root.innerHTML = head + html;
      bindLang();
    };

    function bindLang() {
      const bKa = document.getElementById('btn-ap-ka');
      const bEn = document.getElementById('btn-ap-en');
      if (bKa && bEn) {
        bKa.onclick = () => { lang = 'ka'; localStorage.setItem('rigzea_ap_lang', 'ka'); updateLangUI(); render(); };
        bEn.onclick = () => { lang = 'en'; localStorage.setItem('rigzea_ap_lang', 'en'); updateLangUI(); };
        updateLangUI();
      }
    }

    function updateLangUI() {
      const bKa = document.getElementById('btn-ap-ka');
      const bEn = document.getElementById('btn-ap-en');
      const sub = document.getElementById('ap-sub');
      if (bKa && bEn) {
        bKa.style.background = lang === 'ka' ? 'var(--brand)' : 'none';
        bKa.style.color = lang === 'ka' ? '#fff' : 'var(--muted)';
        bEn.style.background = lang === 'en' ? 'var(--brand)' : 'none';
        bEn.style.color = lang === 'en' ? '#fff' : 'var(--muted)';
      }
      if (sub) sub.textContent = I18N[lang].sub;
    }

    function errorView(msg, retry) {
      show(`<div class="card"><div class="error-state"><p>${esc(msg)}</p>${retry ? `<button type="button" class="btn btn-primary btn-lg" id="retry">${I18N[lang].retry}</button>` : ''}</div></div>`);
      document.getElementById('retry')?.addEventListener('click', load);
    }

    async function load() {
      if (!token) return errorView(I18N[lang].invalidLink);
      show('<div class="card"><div class="skeleton"><i></i><i></i><i></i></div></div>');
      try {
        const { data: res, error } = await sb.rpc('get_public_approval', { p_token: token });
        if (error) throw error;
        if (!res?.success) return errorView(res?.error || I18N[lang].notFound);
        data = res;
        render();
      } catch (err) {
        errorView('Network error. ' + R.friendlyError(err), true);
      }
    }

    function render(state = {}) {
      const t = I18N[lang];
      const a = data.approval, apt = data.apartment || {}, org = data.organization || {}, owner = data.owner || {};
      const [first, ...rest] = String(a.description || '').split('\n');
      const title = a.title || first;
      const details = (a.title && first !== a.title ? a.description : rest.join('\n')).trim();
      const photos = (a.photos || []).map(p => typeof p === 'string' ? p : p?.url).filter(Boolean);
      const expired = a.status === 'pending' && a.expires_at && new Date(a.expires_at) < new Date();
      const contact = org.contact_phone ? `<a href="tel:${esc(org.contact_phone)}">${esc(org.contact_phone)}</a>` : '';

      let action = '';
      if (a.status === 'approved') action = `<div class="ap-result ok"><strong>${t.approvedMsg}</strong>${a.responded_at ? ` (${esc(R.dateTime(a.responded_at))})` : ''} ${t.approvedFollow}</div>`;
      else if (a.status === 'declined') action = `<div class="ap-result no"><strong>${t.declinedMsg}</strong>${a.responded_at ? ` (${esc(R.dateTime(a.responded_at))})` : ''} ${t.declinedFollow}</div>`;
      else if (a.status === 'cancelled') action = `<div class="ap-result" style="background:var(--neutral-bg)">${t.cancelledMsg}</div>`;
      else if (expired) action = `<div class="ap-result" style="background:var(--neutral-bg)">${t.expiredMsg}</div>`;
      else if (state.confirm) {
        const yes = state.confirm === 'approved';
        action = `<div class="ap-confirm">
          <p class="ap-question">${yes ? t.confirmApprove(money(a.amount)) : t.confirmDecline}</p>
          <p class="muted" style="margin-bottom:12px">${yes ? t.noteApprove : t.noteDecline}</p>
          ${state.error ? `<div class="form-error" role="alert">${esc(state.error)}</div>` : ''}
          <label class="field" style="margin-bottom:12px"><span class="field-label">${t.commentField}</span><textarea id="note" rows="2">${esc(state.note || '')}</textarea></label>
          <div class="ap-actions"><button type="button" class="btn ${yes ? 'btn-primary' : 'btn-danger'}" id="send">${yes ? t.yesApprove : t.yesDecline}</button><button type="button" class="btn btn-ghost" id="back">${t.back}</button></div></div>`;
      } else {
        action = `<div class="ap-actions"><button type="button" class="btn btn-primary" data-d="approved">${t.approve} · ${money(a.amount)}</button><button type="button" class="btn btn-danger-outline" data-d="declined">${t.decline}</button></div>`;
      }

      show(`<div class="card"><div class="card-body form-stack">
        <div><p class="muted">${t.reqBy(owner.name, org.name)}</p>
          <h1 style="font-size:20px;margin-top:6px">${esc(title || t.expense)}</h1>
          <div class="ap-amount">${money(a.amount)}</div>
          <p class="muted">${esc(apt.name || '')}${apt.city ? ', ' + esc(apt.city) : ''} · ${t.reqAt} ${esc(R.dateTime(a.created_at))}</p></div>
        ${details ? `<div><div class="section-title">${t.details}</div><p style="white-space:pre-wrap">${esc(details)}</p></div>` : ''}
        ${photos.length ? `<div class="photos">${photos.map(u => `<a class="photo" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo" /></a>`).join('')}</div>` : ''}
        ${a.response_note && a.status !== 'pending' ? `<p class="muted">${t.comment}: „${esc(a.response_note)}“</p>` : ''}
        ${action}
        ${contact ? `<p class="small muted">${t.callPrompt} ${contact}</p>` : ''}
      </div></div>`);

      root.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => render({ confirm: b.dataset.d })));
      document.getElementById('back')?.addEventListener('click', () => render());
      document.getElementById('send')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        if (btn.dataset.busy) return;
        btn.dataset.busy = '1'; btn.disabled = true; btn.classList.add('is-busy');
        const note = document.getElementById('note').value.trim();
        try {
          const { data: res, error } = await sb.rpc('respond_public_approval', { p_token: token, p_decision: state.confirm, p_note: note || null });
          if (error) throw error;
          if (!res?.success) {
            render({ confirm: state.confirm, note, error: res?.error || 'შეცდომა დაფიქსირდა.' });
            return;
          }
          data.approval.status = state.confirm;
          data.approval.response_note = note;
          data.approval.responded_at = new Date().toISOString();
          render();
        } catch (err) {
          const notRecorded = lang === 'en' ? 'Decision not recorded. Please try again.' : 'პასუხი არ დაფიქსირებულა. სცადეთ ხელახლა.';
          render({ confirm: state.confirm, note, error: `${R.friendlyError(err)} ${notRecorded}` });
        } finally {
          btn.dataset.busy = ''; btn.disabled = false; btn.classList.remove('is-busy');
        }
      });
    }

    load();
  })();
  </script>
</body>
</html>
