<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a5c44" />
  <meta name="robots" content="noindex" />
  <title>ხარჯის თანხმობა · რიგზეა</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%230a5c44'/%3E%3Cpath d='M10 12h20M10 20h15M10 28h20' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app/app.css" />
  <style>
    .ap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    .ap-org { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .ap-amount { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
    .ap-question { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .ap-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .ap-actions .btn { min-height: 52px; font-size: 16px; }
    .ap-confirm { padding: 14px; border-radius: var(--r); border: 2px solid var(--line-strong); }
    .ap-result { padding: 16px; border-radius: var(--r); font-size: 15px; }
    .ap-result.ok { background: var(--ok-bg); color: var(--ok); }
    .ap-result.no { background: var(--danger-bg); color: var(--danger); }
  </style>
</head>
<body>
  <main class="ap" id="ap" aria-live="polite">
    <div class="ap-org"><span class="brand-mark" style="width:22px;height:22px;border-radius:5px;background:var(--brand)"></span>რიგზეა · ხარჯის თანხმობა</div>
    <div class="card"><div class="skeleton" aria-label="იტვირთება"><i></i><i></i><i></i></div></div>
  </main>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script>
  (() => {
    const { sb, esc, money } = R;
    const root = document.getElementById('ap');
    const head = root.firstElementChild.outerHTML;
    const token = new URLSearchParams(location.search).get('token');
    let data = null;

    const show = (html) => { root.innerHTML = head + html; };

    function errorView(msg, retry) {
      show(`<div class="card"><div class="error-state"><p>${esc(msg)}</p>${retry ? '<button type="button" class="btn btn-primary btn-lg" id="retry">ხელახლა ცდა</button>' : ''}</div></div>`);
      document.getElementById('retry')?.addEventListener('click', load);
    }

    async function load() {
      if (!token) return errorView('ბმული არასრულია. სთხოვეთ მმართველს ბმულის ხელახლა გამოგზავნა.');
      show('<div class="card"><div class="skeleton"><i></i><i></i><i></i></div></div>');
      try {
        const { data: res, error } = await sb.rpc('get_public_approval', { p_token: token });
        if (error) throw error;
        if (!res?.success) return errorView(res?.error || 'მოთხოვნა ვერ მოიძებნა. შესაძლოა გაუქმდა — დაუკავშირდით მმართველს.');
        data = res;
        render();
      } catch (err) {
        errorView('ინფორმაცია ვერ ჩაიტვირთა. ' + R.friendlyError(err), true);
      }
    }

    function render(state = {}) {
      const a = data.approval, apt = data.apartment || {}, org = data.organization || {}, owner = data.owner || {};
      const [title, ...rest] = String(a.description || '').split('\n');
      const details = rest.join('\n').trim();
      const photos = (a.photos || []).map(p => typeof p === 'string' ? p : p?.url).filter(Boolean);
      const expired = a.status === 'pending' && a.expires_at && new Date(a.expires_at) < new Date();
      const contact = org.contact_phone ? `<a href="tel:${esc(org.contact_phone)}">${esc(org.contact_phone)}</a>` : '';

      let action = '';
      if (a.status === 'approved') action = `<div class="ap-result ok"><strong>ხარჯი დადასტურებულია.</strong>${a.responded_at ? ` (${esc(R.dateTime(a.responded_at))})` : ''} მმართველი შეასრულებს სამუშაოს და ქვითარს ამონაწერში ნახავთ.</div>`;
      else if (a.status === 'declined') action = `<div class="ap-result no"><strong>ხარჯზე უარი დაფიქსირდა.</strong>${a.responded_at ? ` (${esc(R.dateTime(a.responded_at))})` : ''} მმართველი დაგიკავშირდებათ ალტერნატივით.</div>`;
      else if (a.status === 'cancelled') action = `<div class="ap-result" style="background:var(--neutral-bg)">მმართველმა ეს მოთხოვნა გააუქმა. პასუხი აღარ არის საჭირო.</div>`;
      else if (expired) action = `<div class="ap-result" style="background:var(--neutral-bg)">მოთხოვნის ვადა ამოიწურა. სთხოვეთ მმართველს ახალი ბმული.</div>`;
      else if (state.confirm) {
        const yes = state.confirm === 'approved';
        action = `<div class="ap-confirm">
          <p class="ap-question">${yes ? `ადასტურებთ ${money(a.amount)}-ის ხარჯს?` : 'უარს ამბობთ ამ ხარჯზე?'}</p>
          <p class="muted" style="margin-bottom:12px">${yes ? 'მმართველი მიიღებს თანხმობას და დაიწყებს სამუშაოს.' : 'სამუშაო არ შესრულდება, სანამ მმართველთან არ შეთანხმდებით.'}</p>
          ${state.error ? `<div class="form-error" role="alert">${esc(state.error)}</div>` : ''}
          <label class="field" style="margin-bottom:12px"><span class="field-label">კომენტარი მმართველისთვის <span class="muted">(არასავალდებულო)</span></span><textarea id="note" rows="2">${esc(state.note || '')}</textarea></label>
          <div class="ap-actions"><button type="button" class="btn ${yes ? 'btn-primary' : 'btn-danger'}" id="send">${yes ? 'დიახ, ვადასტურებ' : 'დიახ, უარს ვამბობ'}</button><button type="button" class="btn btn-ghost" id="back">უკან</button></div></div>`;
      } else {
        action = `<div class="ap-actions"><button type="button" class="btn btn-primary" data-d="approved">დადასტურება · ${money(a.amount)}</button><button type="button" class="btn btn-danger-outline" data-d="declined">უარყოფა</button></div>`;
      }

      show(`<div class="card"><div class="card-body form-stack">
        <div><p class="muted">${esc(owner.name ? owner.name + ', ' : '')}${esc(org.name || 'მმართველი კომპანია')} გთხოვთ თანხმობას ხარჯზე:</p>
          <h1 style="font-size:20px;margin-top:6px">${esc(title || 'ხარჯი')}</h1>
          <div class="ap-amount">${money(a.amount)}</div>
          <p class="muted">${esc(apt.name || '')}${apt.city ? ', ' + esc(apt.city) : ''} · მოთხოვნილია ${esc(R.dateTime(a.created_at))}</p></div>
        ${details ? `<div><div class="section-title">განმარტება</div><p style="white-space:pre-wrap">${esc(details)}</p></div>` : ''}
        ${photos.length ? `<div class="photos">${photos.map(u => `<a class="photo" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="ფოტო" /></a>`).join('')}</div>` : ''}
        ${a.response_note && a.status !== 'pending' ? `<p class="muted">თქვენი კომენტარი: „${esc(a.response_note)}“</p>` : ''}
        ${action}
        ${contact ? `<p class="small muted">კითხვა გაქვთ? დაურეკეთ მმართველს: ${contact}</p>` : ''}
      </div></div>`);

      root.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => render({ confirm: b.dataset.d })));
      document.getElementById('back')?.addEventListener('click', () => render());
      document.getElementById('send')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        if (btn.dataset.busy) return;
        btn.dataset.busy = '1'; btn.disabled = true; btn.classList.add('is-busy');
        const note = document.getElementById('note').value.trim();
        try {
          const { data: res, error } = await sb.rpc('respond_public_approval', { p_token: token, p_decision: state.confirm, p_note: note || null });
          if (error) throw error;
          if (!res?.success) {
            // Already answered elsewhere: reload to show the recorded decision.
            if (/უკვე/.test(res?.error || '')) return load();
            throw new Error(res?.error || 'პასუხი ვერ დაფიქსირდა.');
          }
          data.approval.status = res.status;
          data.approval.responded_at = new Date().toISOString();
          data.approval.response_note = note || null;
          render();
          document.querySelector('.ap-result')?.focus?.();
        } catch (err) {
          render({ ...state, note, error: R.friendlyError(err) + ' პასუხი არ დაფიქსირებულა — სცადეთ ხელახლა.' });
        }
      });
    }

    load();
  })();
  </script>
</body>
</html>
