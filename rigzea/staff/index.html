<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a5c44" />
  <title>ჩემი სამუშაოები · რიგზეა</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/app/app.css" />
  <style>
    .staff { max-width: 640px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }
    .staff-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .staff-top h1 { font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job { display: block; padding: 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: inherit; }
    .job:active { background: var(--hover); }
    .job-time { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
    .job-apt { font-weight: 600; font-size: 16px; margin-top: 2px; }
    .job-meta { color: var(--muted); font-size: 13px; }
    .job-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .group-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 2px 8px; }
    .action-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
    .action-bar .btn { flex: 1; min-height: 50px; font-size: 15px; }
    .access dd { font-size: 15px; }
    .upload-row { display: flex; gap: 8px; }
    .upload-row label { flex: 1; min-height: 48px; }
  </style>
</head>
<body>
  <header class="staff-top">
    <button type="button" class="icon-btn" id="btn-back" aria-label="უკან" hidden><span data-icon="back"></span></button>
    <span class="brand-mark" style="width:24px;height:24px;border-radius:6px;flex:none" title="რიგზეა"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><g transform="translate(12 11.5) scale(1.2) translate(-12 -11.5)"><path d="M4 12L12 5L16.5 9"/><path d="M6.5 6.5V9.8"/><path d="M8.5 14.5L12 18L20 10"/></g></svg></span>
    <h1 id="staff-title">ჩემი სამუშაოები</h1>
    <button type="button" class="icon-btn" id="btn-refresh" aria-label="განახლება"><span data-icon="refresh"></span></button>
    <button type="button" class="icon-btn" id="btn-menu" aria-label="მენიუ"><span data-icon="user"></span></button>
  </header>
  <main class="staff" id="staff-view" tabindex="-1"><div class="skeleton"><i></i><i></i><i></i></div></main>
  <div id="action-bar"></div>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script src="/staff/staff.js"></script>
</body>
</html>
