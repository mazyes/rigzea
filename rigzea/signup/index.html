<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <script>(function(){var en=false;try{en=localStorage.getItem('rigzea_lang')==='en'}catch(e){}window.RLang={lang:en?'en':'ka'};if(en){var s=document.createElement('script');s.src='/js/i18n.js';document.head.appendChild(s)}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
  <link rel="icon" href="/favicon.ico?v=6" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <title>რეგისტრაცია (14 დღე უფასოდ) · Rigzea</title>

  <link rel="stylesheet" href="/app/app.css?v=112078b6" />
<link rel="stylesheet" href="/js/site-tools.css?v=2d31c4da" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <main id="auth" class="auth" style="display:flex;width:100%;justify-content:center;padding:20px">
    <div class="auth-card">
      <a class="brand" href="/" aria-label="Rigzea: მთავარი გვერდი"><span class="brand-mark" data-icon="logo"></span><span class="brand-text">რიგზეა<i>.</i></span></a>

      <div class="auth-tabs" id="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tab-auth-signup"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>რეგისტრაცია (14 დღე უფასოდ)</button>
        <a class="auth-tab" href="/signin/" id="tab-auth-signin">შესვლა</a>
      </div>

      <div class="oauth-stack" id="auth-oauth-stack">
        <button type="button" class="btn btn-oauth btn-google" data-oauth="google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span id="oauth-google-label">Google-ით რეგისტრაცია</span>
        </button>
      </div>

      <div class="auth-divider" id="auth-divider">
        <span>ან ელფოსტით</span>
      </div>

      <form id="form-signup" class="form-stack" novalidate>
        <div>
          <h1>ანგარიშის შექმნა</h1>
          <p class="page-sub"><strong>14 დღე უფასო საცდელი პერიოდი</strong> · საბანკო ბარათი არ არის საჭირო.</p>
        </div>
        <div class="form-error" role="alert" hidden></div>
        <label class="field"><span class="field-label">სახელი და გვარი</span><input type="text" name="name" required autocomplete="name" data-error="შეიყვანე სახელი." placeholder="მაგ.: გიორგი ბერიძე" /></label>
        <label class="field"><span class="field-label">ელფოსტა</span><input type="email" name="email" required autocomplete="email" data-error="შეიყვანე სწორი ელფოსტა." placeholder="name@example.com" /></label>
        <label class="field"><span class="field-label">პაროლი</span><input type="password" name="password" required minlength="8" autocomplete="new-password" data-error="პაროლი მინიმუმ 8 სიმბოლოს უნდა შეიცავდეს." /><span class="field-hint">მინიმუმ 8 სიმბოლო</span></label>
        <label class="auth-consent" id="signup-consent-label">
          <input type="checkbox" name="agree" id="signup-agree" required data-error="რეგისტრაციისთვის დაეთანხმე მომსახურების წესებს, კონფიდენციალურობის, ქუქიებისა და თანხის დაბრუნების (24 სთ) პოლიტიკას." />
          <span>ვეთანხმები <a href="/legal/terms/" target="_blank" rel="noopener">მომსახურების წესებს</a>, <a href="/legal/privacy/" target="_blank" rel="noopener">კონფიდენციალურობის პოლიტიკას</a>, <a href="/legal/cookies/" target="_blank" rel="noopener">ქუქიების პოლიტიკას</a> და <a href="/legal/refund/" target="_blank" rel="noopener">თანხის დაბრუნების პოლიტიკას (24 სთ)</a>.</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block">რეგისტრაცია (14 დღე უფასოდ)</button>
        <div class="auth-demo-prompt">
          <a class="btn btn-secondary btn-block" href="/demo/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>სცადე დემო (რეგისტრაციის გარეშე)</a>
        </div>
        <p class="auth-foot">უკვე გაქვს ანგარიში? <a class="link-btn" href="/signin/">შესვლა</a></p>
      </form>
    </div>
  </main>

  <script src="/js/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/site-tools.js?v=a5844986"></script>
  <script>
    (async () => {
      'use strict';
      const { sb, $, $$, icon } = R;

      $$('[data-icon]').forEach(el => { if (!el.firstChild) el.innerHTML = icon(el.dataset.icon, el.classList.contains('brand-mark') ? 16 : 18); });

      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) {
          location.replace('/app/');
          return;
        }
      } catch (e) {}

      const form = $('#form-signup');
      const errBox = form.querySelector('.form-error');

      function authError(err) {
        const m = String(err?.message || '');
        if (/already registered/i.test(m)) return 'ეს ელფოსტა უკვე რეგისტრირებულია. სცადე შესვლა.';
        if (/weak|at least \d+ characters/i.test(m)) return 'პაროლი ძალიან სუსტია. გამოიყენე მინიმუმ 8 სიმბოლო.';
        return R.friendlyError(err);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        const invalid = $$('input', form).find(el => !el.checkValidity());
        if (invalid) {
          errBox.textContent = invalid.dataset.error || 'შეავსე სავალდებულო ველები.';
          errBox.hidden = false;
          invalid.focus();
          return;
        }
        const btn = form.querySelector('[type=submit]');
        if (btn.dataset.busy === '1') return;
        btn.dataset.busy = '1'; btn.disabled = true; btn.classList.add('is-busy');

        try {
          const email = form.email.value.trim();
          const password = form.password.value;
          const name = form.name.value.trim();
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: name,
                campaign: window.RigzeaCampaign?.(),
                terms_accepted_at: new Date().toISOString(),
                policies_accepted_version: '2026-10-16'
              },
              emailRedirectTo: location.origin + '/app/'
            }
          });
          if (error) throw error;
          if (!data.session) {
            location.replace('/signin/');
            return;
          }
          location.replace('/app/');
        } catch (err) {
          console.error(err);
          errBox.textContent = authError(err);
          errBox.hidden = false;
        } finally {
          btn.dataset.busy = ''; btn.disabled = false; btn.classList.remove('is-busy');
        }
      });

      const googleBtn = $('[data-oauth="google"]');
      const agreeCb = $('#signup-agree');
      const agreeLbl = $('#signup-consent-label');
      if (agreeCb) {
        agreeCb.addEventListener('change', (e) => {
          if (e.target.checked) {
            if (agreeLbl) agreeLbl.classList.remove('is-invalid');
            if (errBox) errBox.hidden = true;
          }
        });
      }
      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          if (agreeCb && !agreeCb.checked) {
            errBox.textContent = 'რეგისტრაციისთვის ჯერ მონიშნე თანხმობა მომსახურების წესებსა და თანხის დაბრუნების (24 სთ) პოლიტიკაზე.';
            errBox.hidden = false;
            if (agreeLbl) agreeLbl.classList.add('is-invalid');
            agreeCb.focus();
            return;
          }
          if (googleBtn.dataset.busy === '1') return;
          googleBtn.dataset.busy = '1'; googleBtn.disabled = true;
          try {
            const { error } = await sb.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: location.origin + '/app/' }
            });
            if (error) throw error;
          } catch (err) {
            console.error('OAuth error:', err);
            R.toast(`ავტორიზაციის შეცდომა: ${R.friendlyError(err)}`, { type: 'error' });
            googleBtn.dataset.busy = ''; googleBtn.disabled = false;
          }
        });
      }
    })();
  </script>
</body>
</html>
